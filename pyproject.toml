[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-restore-amd"
version = "1.0.0"
description = "Restorasi area mosaic pada video dengan GPU AMD (ROCm / DirectML)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
# PyTorch + torchvision TIDAK dicantumkan: dipasang terpisah sesuai GPU
# (ROCm / DirectML / CPU) oleh install_linux.sh / install_windows.bat.
dependencies = [
    "numpy>=1.24",
    "ultralytics>=8.3.200,<9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mosaic-restore = "mosaic_restore.cli:main"

[tool.setuptools.packages.find]
include = ["mosaic_restore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
